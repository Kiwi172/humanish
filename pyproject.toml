[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "account-warmer"
version = "0.1.0"
description = "Local Instagram/TikTok account warmer: human-like feed warming in persistent mobile-emulated browser contexts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Pinned ranges — upgrade deliberately and re-run `warmer check-selectors` after any bump.
    "playwright>=1.45,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "jinja2>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "rich>=13.0,<14",          # CLI tables/pretty output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",  # starlette TestClient backend — required by tests/test_api.py
]
# R19: playwright-extra lags Playwright releases and may be missing from mirrors — the
# in-repo init-script stealth fallback (browser/stealth_patches.py) covers its absence.
# Install with `pip install -e ".[dev,stealth]"` when available on your index.
stealth = [
    "playwright-extra>=3.5,<4",
]

[project.scripts]
warmer = "account_warmer.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
