# Instagram comment pools (SPEC §2.10). Tagged sections + {placeholder} substitution.
# Placeholders are resolved at pick time by core/behavior (Step 3):
#   {adjective} -> random adjective from the built-in list; {emoji} -> rare, single emoji.
# Style guide: short, lowercase-leaning, NO hashtags (hashtags on a new account look bot-ish),
# no perfect grammar. Keep this pool small — variety comes from timing, not volume.

